<svg width="1200" height="360" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>

    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>

  <!-- Neural network -->
  <g stroke="#64748b" stroke-width="2" opacity="0.45">

    <line x1="820" y1="100" x2="960" y2="70"/>
    <line x1="820" y1="100" x2="960" y2="180"/>
    <line x1="820" y1="220" x2="960" y2="180"/>
    <line x1="820" y1="220" x2="960" y2="290"/>

    <line x1="960" y1="70" x2="1080" y2="130"/>
    <line x1="960" y1="180" x2="1080" y2="130"/>
    <line x1="960" y1="180" x2="1080" y2="250"/>
    <line x1="960" y1="290" x2="1080" y2="250"/>

  </g>

  <g fill="url(#accent)">

    <circle cx="820" cy="100" r="10"/>
    <circle cx="820" cy="220" r="10"/>

    <circle cx="960" cy="70" r="10"/>
    <circle cx="960" cy="180" r="10"/>
    <circle cx="960" cy="290" r="10"/>

    <circle cx="1080" cy="130" r="12"/>
    <circle cx="1080" cy="250" r="12"/>

  </g>

  <!-- Title -->
  <text
    x="80"
    y="145"
    fill="white"
    font-family="Arial, Helvetica, sans-serif"
    font-size="64"
    font-weight="700">
    CogniPlan AI
  </text>

  <!-- Subtitle -->
  <text
    x="84"
    y="195"
    fill="#cbd5e1"
    font-family="Arial, Helvetica, sans-serif"
    font-size="26">
    Adaptive Agentic Learning System
  </text>

  <!-- Tagline -->
  <text
    x="84"
    y="245"
    fill="#94a3b8"
    font-family="Arial, Helvetica, sans-serif"
    font-size="19">
    PLAN • STUDY • EVALUATE • ADAPT • REPLAN
  </text>

  <!-- Accent line -->
  <rect
    x="84"
    y="275"
    width="330"
    height="4"
    rx="2"
    fill="url(#accent)"/>

</svg>
